name: iOS Build CI

on:
  push:
    branches: [ main, 'cursor/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: List available Xcode versions
      run: ls -la /Applications/ | grep Xcode
      
    - name: Select Xcode version
      run: |
        # Try Xcode 15.4, 15.3, or fall back to default
        if [ -d "/Applications/Xcode_15.4.app" ]; then
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
        elif [ -d "/Applications/Xcode_15.3.app" ]; then
          sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
        else
          echo "Using default Xcode"
        fi
      
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Build for iOS Simulator
      run: |
        cd ios
        xcodebuild clean build \
          -project calorietracker.xcodeproj \
          -scheme calorietracker \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty && exit ${PIPESTATUS[0]}
      
    - name: Run tests
      run: |
        cd ios
        xcodebuild test \
          -project calorietracker.xcodeproj \
          -scheme calorietracker \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty && exit ${PIPESTATUS[0]}
      continue-on-error: true
      
    - name: Build for Generic iOS Device
      run: |
        cd ios
        xcodebuild clean build \
          -project calorietracker.xcodeproj \
          -scheme calorietracker \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty && exit ${PIPESTATUS[0]}
