name: TestFlight Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Upload to TestFlight
    runs-on: macos-15  # Latest macOS runner for Xcode 26

    steps:
    - name: Check required secrets
      env:
        KEY_ID: ${{ secrets.KEY_ID }}
        ISSUER_ID: ${{ secrets.ISSUER_ID }}
        AUTH_KEY: ${{ secrets.AUTH_KEY }}
      run: |
        missing=0
        if [ -z "${KEY_ID}" ]; then
          echo "ERROR: KEY_ID secret is empty or not set"
          missing=1
        fi
        if [ -z "${ISSUER_ID}" ]; then
          echo "ERROR: ISSUER_ID secret is empty or not set"
          missing=1
        fi
        if [ -z "${AUTH_KEY}" ]; then
          echo "ERROR: AUTH_KEY secret is empty or not set"
          missing=1
        fi
        if [ "${missing}" -ne 0 ]; then
          echo "ERROR: Set KEY_ID, ISSUER_ID, and AUTH_KEY repository secrets, then re-run."
          exit 1
        fi
        echo "Required App Store Connect API secrets are present."

    - name: Checkout code
      uses: actions/checkout@v4

    - name: List available Xcode versions
      run: find /Applications -maxdepth 1 -name 'Xcode*.app' -exec ls -ld {} +

    - name: Select latest Xcode 26
      run: |
        shopt -s nullglob
        candidates=(/Applications/Xcode_26*.app)
        if [ "${#candidates[@]}" -eq 0 ]; then
          echo "ERROR: No Xcode 26.x found. Project requires Swift 6.2 (Xcode 26+)"
          exit 1
        fi
        LATEST_XCODE=$(printf '%s\n' "${candidates[@]}" | sort -V | tail -1)
        echo "Selected: ${LATEST_XCODE}"
        sudo xcode-select -s "${LATEST_XCODE}/Contents/Developer"

    - name: Show Xcode version
      run: |
        xcodebuild -version
        swift --version

    - name: Create API Key file
      env:
        AUTH_KEY: ${{ secrets.AUTH_KEY }}
        KEY_ID: ${{ secrets.KEY_ID }}
      run: |
        # altool --apiKey looks up ~/private_keys/AuthKey_<KEY_ID>.p8
        mkdir -p "${HOME}/private_keys"
        key_file="${HOME}/private_keys/AuthKey_${KEY_ID}.p8"

        # Write AUTH_KEY to file preserving newlines. Never echo the key.
        printf '%s\n' "$AUTH_KEY" > "${key_file}"
        chmod 600 "${key_file}"

        if [ ! -s "${key_file}" ]; then
          echo "ERROR: Failed to create API key file"
          exit 1
        fi
        echo "API key file created at ~/private_keys/AuthKey_<KEY_ID>.p8"
        wc -l < "${key_file}"

    - name: Set build number
      run: |
        # github.run_number becomes CFBundleVersion via CURRENT_PROJECT_VERSION
        # on the archive command, so the app and extensions stay in sync.
        BUILD_NUMBER="${{ github.run_number }}"
        echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
        echo "Setting build number to ${BUILD_NUMBER}"

    - name: Build and archive for App Store
      env:
        KEY_ID: ${{ secrets.KEY_ID }}
        ISSUER_ID: ${{ secrets.ISSUER_ID }}
      run: |
        set -o pipefail
        cd ios
        mkdir -p build

        # Bundle IDs stay on the per-target values in project.pbxproj.
        # A command-line PRODUCT_BUNDLE_IDENTIFIER would apply to every target.
        xcodebuild archive \
          -project calorietracker.xcodeproj \
          -scheme calorietracker \
          -configuration Release \
          -archivePath build/JLPhysical.xcarchive \
          -destination 'generic/platform=iOS' \
          -allowProvisioningUpdates \
          -authenticationKeyPath "${HOME}/private_keys/AuthKey_${KEY_ID}.p8" \
          -authenticationKeyID "${KEY_ID}" \
          -authenticationKeyIssuerID "${ISSUER_ID}" \
          DEVELOPMENT_TEAM=2UMNXHG36N \
          CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
          CODE_SIGN_STYLE=Automatic \
          | tee build_archive.log

        if [ ! -d "build/JLPhysical.xcarchive" ]; then
          echo "ERROR: Archive was not created"
          exit 1
        fi

        echo "Archive created successfully"

    - name: Export IPA for App Store
      env:
        KEY_ID: ${{ secrets.KEY_ID }}
        ISSUER_ID: ${{ secrets.ISSUER_ID }}
      run: |
        set -o pipefail
        cd ios
        mkdir -p build

        # destination=export writes a local IPA. altool performs the upload.
        cat > build/ExportOptions.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>2UMNXHG36N</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
        </dict>
        </plist>
        EOF

        xcodebuild -exportArchive \
          -archivePath build/JLPhysical.xcarchive \
          -exportPath build/output \
          -exportOptionsPlist build/ExportOptions.plist \
          -allowProvisioningUpdates \
          -authenticationKeyPath "${HOME}/private_keys/AuthKey_${KEY_ID}.p8" \
          -authenticationKeyID "${KEY_ID}" \
          -authenticationKeyIssuerID "${ISSUER_ID}" \
          | tee build_export.log

        # IPA filename follows PRODUCT_NAME ($(TARGET_NAME) -> calorietracker).
        shopt -s nullglob
        ipa_files=(build/output/*.ipa)
        if [ "${#ipa_files[@]}" -ne 1 ]; then
          echo "ERROR: Expected exactly one IPA in build/output, found ${#ipa_files[@]}"
          ls -la build/output/ || true
          exit 1
        fi
        echo "IPA_PATH=${ipa_files[0]}" >> "$GITHUB_ENV"
        echo "IPA exported successfully"
        ls -lh "${ipa_files[0]}"

    - name: Upload to TestFlight
      env:
        KEY_ID: ${{ secrets.KEY_ID }}
        ISSUER_ID: ${{ secrets.ISSUER_ID }}
      run: |
        cd ios

        if [ -z "${IPA_PATH:-}" ] || [ ! -f "${IPA_PATH}" ]; then
          echo "ERROR: IPA was not found for upload"
          exit 1
        fi

        # --apiKey/--apiIssuer load ~/private_keys/AuthKey_<KEY_ID>.p8
        xcrun altool --upload-app \
          --type ios \
          --file "${IPA_PATH}" \
          --apiKey "${KEY_ID}" \
          --apiIssuer "${ISSUER_ID}" \
          --verbose

        echo "Upload to TestFlight initiated"
        echo ""
        echo "The build will appear in App Store Connect → TestFlight within 5-15 minutes."
        echo "You will receive an email when processing is complete."

    - name: Upload build logs as artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          ios/build_archive.log
          ios/build_export.log
        retention-days: 30

    - name: Clean up API key
      if: always()
      run: |
        rm -rf "${HOME}/private_keys"
        echo "API key file removed"
